<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>La Fioritura di Montesano</title>
    <meta name="description" content="A point, a place, a story">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <aside class="explore" aria-label="Site navigation">
      <div class="explore__line"></div>
      <p id="nav-eyebrow">EXPLORE</p>
      <nav id="navigation"></nav>
    </aside>

    <main>
      <section class="hero" aria-label="Montesano landscape">
        <video id="hero-video" autoplay muted loop playsinline poster="assets/hero-field.png"></video>
        <img id="hero-image" src="assets/hero-field.png" alt="">
      </section>

      <section class="land section-pad" id="the-land">
        <p class="kicker" id="land-kicker"></p>
        <h1 id="land-title"></h1>
        <div class="intro-copy" id="land-intro"></div>
      </section>

      <section class="story-flow" id="story-flow"></section>

      <section class="making section-pad" id="the-making">
        <div class="making__text">
          <p id="making-intro"></p>
          <p class="kicker" id="making-kicker"></p>
          <h2 id="making-title"></h2>
        </div>
        <div class="gallery" id="making-gallery"></div>
      </section>

      <section class="quiet-links section-pad" id="extra-sections"></section>
    </main>

    <a class="cms-link" href="admin.html" aria-label="Open CMS">CMS</a>
    <script src="script.js"></script>
  </body>
</html>
